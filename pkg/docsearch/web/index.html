<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocSearch - Desktop Document Search</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --highlight: #fef08a;
      --radius: 8px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
    }
    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }
    .search-input-box {
      display: flex;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      font-size: 16px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #ffffff;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .search-btn {
      padding: 12px 24px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-btn:hover {
      background: var(--primary-hover);
    }
    /* Suggestions Dropdown */
    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      margin-top: 4px;
      z-index: 50;
      list-style: none;
      overflow: hidden;
      display: none;
    }
    .suggestion-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .suggestion-item:hover, .suggestion-item.active {
      background-color: #f1f5f9;
      color: var(--primary);
    }
    .suggestion-icon {
      color: var(--text-muted);
      font-size: 12px;
    }
    /* Index Filters */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .filter-checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .filter-checkbox-item input {
      cursor: pointer;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 9999px;
      background: #e2e8f0;
      color: #334155;
    }
    /* Expansion Tags */
    .expansion-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
      min-height: 28px;
    }
    .expansion-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .expansion-tag {
      padding: 4px 10px;
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      border-radius: 9999px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .expansion-tag:hover {
      background: #dbeafe;
      border-color: var(--primary);
    }
    /* Results */
    .results-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .result-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .result-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .result-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--primary);
    }
    .type-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .type-pdf { background: #fee2e2; color: #b91c1c; }
    .type-excel, .type-xlsx, .type-xls { background: #dcfce7; color: #15803d; }
    .type-pptx, .type-ppt { background: #ffedd5; color: #c2410c; }
    .type-docx, .type-doc, .type-text, .type-csv { background: #e0e7ff; color: #4338ca; }
    .index-badge {
      background: #f1f5f9;
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .result-path {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      word-break: break-all;
    }
    .result-snippet {
      font-size: 14px;
      color: #334155;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    mark {
      background: var(--highlight);
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .result-actions {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .action-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 14px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 100;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Settings Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.05);
      width: 90%;
      max-width: 680px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      animation: modalSlide 0.2s ease-out;
    }
    @keyframes modalSlide {
      from { transform: translateY(16px); opacity: 0.8; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-close-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .modal-close-btn:hover {
      color: var(--text);
      background: #f1f5f9;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      background: #fafafa;
    }
    .modal-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .settings-index-container {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #ffffff;
    }
    .settings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .settings-table th {
      text-align: left;
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 600;
    }
    .settings-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .settings-table tr:last-child td {
      border-bottom: none;
    }
    .health-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .health-ok {
      color: #16a34a;
    }
    .health-error {
      color: #dc2626;
    }
    .add-index-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8fafc;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .form-row {
      display: flex;
      gap: 8px;
    }
    .form-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      background: #ffffff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    .btn-delete {
      color: #dc2626;
      border-color: #fecaca;
      background: #ffffff;
      padding: 4px 10px;
      font-size: 12px;
    }
    .btn-delete:hover {
      background: #fee2e2;
      border-color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <div class="header-title" style="margin-bottom: 0;">
          <span>🔍</span> DocSearch
        </div>
        <button id="settingsBtn" class="action-btn" title="インデックス設定" style="display: flex; align-items: center; gap: 6px; font-weight: 500;">
          ⚙️ <span>設定</span>
        </button>
      </div>

      <div class="search-wrapper">
        <div class="search-input-box">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="ドキュメントを全文検索... (Esc: クリア, ↑↓: 候補選択)"
            autocomplete="off"
          />
          <button id="searchBtn" class="search-btn">検索</button>
        </div>
        <ul id="suggestionsList" class="suggestions-list"></ul>
      </div>

      <div class="filter-bar" id="filterBar">
        <span class="filter-label">対象インデックス:</span>
        <div id="indexCheckboxes" style="display: flex; gap: 12px; flex-wrap: wrap;"></div>
      </div>

      <div class="expansion-bar" id="expansionBar" style="display: none;">
        <span class="expansion-label">関連キーワード:</span>
        <div id="expansionTags" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
      </div>
    </header>

    <main>
      <div id="resultsMeta" class="results-meta" style="display: none;"></div>
      <div id="resultsList" class="result-list"></div>
      <div id="emptyState" class="empty-state">
        検索キーワードを入力して検索してください。
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">⚙️ インデックス設定</div>
        <button id="modalCloseBtn" class="modal-close-btn" title="閉じる">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          <div class="modal-section-title">登録済みインデックス</div>
          <div id="settingsIndexList" class="settings-index-container">
            <!-- Table will be rendered dynamically -->
          </div>
        </div>

        <div>
          <div class="modal-section-title">新規インデックス追加</div>
          <div class="add-index-form">
            <div class="form-row">
              <input type="text" id="newIndexPath" class="form-input" placeholder="インデックスフォルダのパス (例: C:\path\to\data.bleve)">
            </div>
            <div class="form-row">
              <input type="text" id="newIndexName" class="form-input" placeholder="表示名 (省略時はフォルダ名から自動生成)">
              <button id="addIndexBtn" class="search-btn" style="padding: 8px 20px; white-space: nowrap;">追加</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modalFooterCloseBtn" class="action-btn" style="padding: 8px 18px;">閉じる</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    window.name = "docsearch_main_tab";

    let activeSuggestionIndex = -1;
    let suggestionsData = [];
    let debounceTimer = null;
    let selectedIndexes = new Set();
    let currentRegisteredIndexes = [];
    let lastIndexCounts = {};

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const suggestionsList = document.getElementById('suggestionsList');
    const indexCheckboxes = document.getElementById('indexCheckboxes');
    const expansionBar = document.getElementById('expansionBar');
    const expansionTags = document.getElementById('expansionTags');
    const resultsMeta = document.getElementById('resultsMeta');
    const resultsList = document.getElementById('resultsList');
    const emptyState = document.getElementById('emptyState');
    const toast = document.getElementById('toast');

    // Modal elements
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalFooterCloseBtn = document.getElementById('modalFooterCloseBtn');
    const settingsIndexList = document.getElementById('settingsIndexList');
    const newIndexPath = document.getElementById('newIndexPath');
    const newIndexName = document.getElementById('newIndexName');
    const addIndexBtn = document.getElementById('addIndexBtn');

    function showToast(message) {
      toast.textContent = message;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    function openSettingsModal() {
      settingsModal.classList.add('open');
      loadSettingsIndexes();
    }

    function closeSettingsModal() {
      settingsModal.classList.remove('open');
    }

    async function loadSettingsIndexes() {
      try {
        const res = await fetch('/api/indexes');
        if (!res.ok) throw new Error('インデックス一覧の取得に失敗しました');
        const indexes = await res.json();
        currentRegisteredIndexes = indexes || [];
        renderSettingsTable(currentRegisteredIndexes);
        updateIndexCheckboxes();
      } catch (err) {
        settingsIndexList.innerHTML = `<div style="padding: 16px; color: #dc2626;">エラー: ${escapeHTML(err.message)}</div>`;
      }
    }

    function renderSettingsTable(indexes) {
      if (!indexes || indexes.length === 0) {
        settingsIndexList.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-muted);">登録されているインデックスはありません。</div>';
        return;
      }

      let html = `
        <table class="settings-table">
          <thead>
            <tr>
              <th>表示名</th>
              <th>パス</th>
              <th>状態</th>
              <th style="text-align: right;">操作</th>
            </tr>
          </thead>
          <tbody>
      `;

      indexes.forEach(idx => {
        const statusHtml = idx.exists
          ? '<span class="health-badge health-ok">✅ 正常</span>'
          : '<span class="health-badge health-error">⚠️ 見つかりません</span>';

        html += `
          <tr>
            <td><strong>${escapeHTML(idx.name || idx.id)}</strong></td>
            <td style="color: var(--text-muted); word-break: break-all; font-family: monospace; font-size: 12px;">${escapeHTML(idx.path)}</td>
            <td>${statusHtml}</td>
            <td style="text-align: right;">
              <button class="action-btn btn-delete" onclick="deleteIndex('${escapeJsStr(idx.id)}')">削除</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      settingsIndexList.innerHTML = html;
    }

    async function addIndex() {
      const path = newIndexPath.value.trim();
      const name = newIndexName.value.trim();
      if (!path) {
        showToast('インデックスフォルダのパスを入力してください');
        newIndexPath.focus();
        return;
      }

      try {
        addIndexBtn.disabled = true;
        addIndexBtn.textContent = '追加中...';

        const res = await fetch('/api/indexes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, name, default_selected: true })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'インデックス追加に失敗しました');
        }

        newIndexPath.value = '';
        newIndexName.value = '';
        showToast('インデックスを追加しました');
        await loadSettingsIndexes();
      } catch (err) {
        showToast(`エラー: ${err.message}`);
      } finally {
        addIndexBtn.disabled = false;
        addIndexBtn.textContent = '追加';
      }
    }

    async function deleteIndex(id) {
      if (!confirm(`インデックス「${id}」を登録解除しますか？`)) {
        return;
      }

      try {
        const res = await fetch(`/api/indexes?id=${encodeURIComponent(id)}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'インデックス削除に失敗しました');
        }

        selectedIndexes.delete(id);
        showToast('インデックスを削除しました');
        await loadSettingsIndexes();
      } catch (err) {
        showToast(`エラー: ${err.message}`);
      }
    }

    function updateIndexCheckboxes(counts) {
      if (counts) {
        lastIndexCounts = counts;
      }

      if (!currentRegisteredIndexes || currentRegisteredIndexes.length === 0) {
        indexCheckboxes.innerHTML = '<span style="font-size: 13px; color: var(--text-muted);">（インデックス未登録）</span>';
        return;
      }

      indexCheckboxes.innerHTML = '';
      currentRegisteredIndexes.forEach(idx => {
        const label = document.createElement('label');
        label.className = 'filter-checkbox-item';

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.value = idx.id;

        if (selectedIndexes.size === 0) {
          chk.checked = idx.default_selected !== false;
          if (chk.checked) {
            selectedIndexes.add(idx.id);
          }
        } else {
          chk.checked = selectedIndexes.has(idx.id);
        }

        chk.addEventListener('change', () => {
          if (chk.checked) {
            selectedIndexes.add(idx.id);
          } else {
            selectedIndexes.delete(idx.id);
          }
          executeSearch();
        });

        label.appendChild(chk);
        label.appendChild(document.createTextNode((idx.name || idx.id) + ' '));

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = lastIndexCounts[idx.id] !== undefined ? lastIndexCounts[idx.id] : 0;
        label.appendChild(badge);

        indexCheckboxes.appendChild(label);
      });
    }

    async function loadSuggestions(prefix) {
      if (!prefix.trim()) {
        hideSuggestions();
        return;
      }
      try {
        const res = await fetch(`/api/history/suggest?prefix=${encodeURIComponent(prefix)}&limit=8`);
        if (!res.ok) return;
        const data = await res.json();
        suggestionsData = data.suggestions || [];
        renderSuggestions();
      } catch (err) {
        console.error('Suggest error:', err);
      }
    }

    function renderSuggestions() {
      if (suggestionsData.length === 0) {
        hideSuggestions();
        return;
      }
      suggestionsList.innerHTML = '';
      suggestionsData.forEach((sug, idx) => {
        const li = document.createElement('li');
        li.className = 'suggestion-item' + (idx === activeSuggestionIndex ? ' active' : '');
        li.innerHTML = `<span class="suggestion-icon">🕒</span> <span>${escapeHTML(sug)}</span>`;
        li.addEventListener('click', () => {
          searchInput.value = sug;
          hideSuggestions();
          executeSearch();
        });
        suggestionsList.appendChild(li);
      });
      suggestionsList.style.display = 'block';
    }

    function hideSuggestions() {
      suggestionsList.style.display = 'none';
      activeSuggestionIndex = -1;
    }

    async function loadExpansions(query) {
      if (!query.trim()) {
        expansionBar.style.display = 'none';
        return;
      }
      try {
        const res = await fetch(`/api/expand?q=${encodeURIComponent(query)}`);
        if (!res.ok) return;
        const data = await res.json();
        const keywords = data.expanded_keywords || [];
        renderExpansions(keywords, query);
      } catch (err) {
        expansionBar.style.display = 'none';
      }
    }

    function renderExpansions(keywords, currentQuery) {
      const filtered = keywords.filter(k => k.toLowerCase() !== currentQuery.trim().toLowerCase());
      if (filtered.length === 0) {
        expansionBar.style.display = 'none';
        return;
      }
      expansionTags.innerHTML = '';
      filtered.forEach(kw => {
        const btn = document.createElement('button');
        btn.className = 'expansion-tag';
        btn.textContent = '+ ' + kw;
        btn.addEventListener('click', () => {
          searchInput.value = `${searchInput.value.trim()} ${kw}`;
          executeSearch();
        });
        expansionTags.appendChild(btn);
      });
      expansionBar.style.display = 'flex';
    }

    async function executeSearch() {
      const query = searchInput.value.trim();
      hideSuggestions();

      if (!query) {
        resultsList.innerHTML = '';
        resultsMeta.style.display = 'none';
        expansionBar.style.display = 'none';
        emptyState.style.display = 'block';
        emptyState.textContent = '検索キーワードを入力してください。';
        updateURL(query);
        return;
      }

      emptyState.style.display = 'none';
      resultsList.innerHTML = '<div style="text-align: center; padding: 32px; color: var(--text-muted);">検索中...</div>';

      updateURL(query);
      loadExpansions(query);

      try {
        let url = `/api/search?q=${encodeURIComponent(query)}&limit=50`;
        if (selectedIndexes.size > 0) {
          url += `&indexes=${Array.from(selectedIndexes).join(',')}`;
        }

        const res = await fetch(url);
        if (!res.ok) throw new Error('Search request failed');
        const data = await res.json();

        updateIndexCheckboxes(data.index_counts || {});
        renderResults(data);
      } catch (err) {
        resultsList.innerHTML = '';
        emptyState.style.display = 'block';
        emptyState.textContent = `検索中にエラーが発生しました: ${err.message}`;
      }
    }

    function renderResults(data) {
      resultsList.innerHTML = '';
      const hits = data.results || [];

      resultsMeta.style.display = 'block';
      resultsMeta.textContent = `${data.total_hits || hits.length} 件のドキュメントが見つかりました`;

      if (hits.length === 0) {
        emptyState.style.display = 'block';
        emptyState.textContent = '一致するドキュメントは見つかりませんでした。';
        return;
      }

      emptyState.style.display = 'none';

      hits.forEach(item => {
        const card = document.createElement('div');
        card.className = 'result-card';

        const fileType = (item.file_type || '').toLowerCase();
        let typeClass = 'type-' + fileType;

        let pageInfo = '';
        if (item.page > 0) {
          pageInfo = `<span class="index-badge">P.${item.page}</span>`;
        }

        let indexInfo = '';
        if (item.index_name || item.index_id) {
          indexInfo = `<span class="index-badge">📂 ${escapeHTML(item.index_name || item.index_id)}</span>`;
        }

        card.innerHTML = `
          <div class="result-header">
            <div class="result-title-group">
              <span class="type-badge ${typeClass}">${escapeHTML(fileType || 'DOC')}</span>
              <span class="result-title">${escapeHTML(item.file_name || '無題')}</span>
              ${pageInfo}
              ${indexInfo}
            </div>
            <span style="font-size: 11px; color: var(--text-muted);">スコア: ${item.score ? item.score.toFixed(2) : '-'}</span>
          </div>
          <div class="result-path">${escapeHTML(item.file_path || '')}</div>
          <div class="result-snippet">${item.snippet || '本文プレビューなし'}</div>
          <div class="result-actions">
            <button class="action-btn" onclick="openFile('${escapeJsStr(item.file_path)}', false)">📄 ファイルを開く</button>
            <button class="action-btn" onclick="openFile('${escapeJsStr(item.file_path)}', true)">📁 フォルダで表示</button>
          </div>
        `;
        resultsList.appendChild(card);
      });
    }

    async function openFile(filePath, selectInFolder) {
      try {
        const res = await fetch('/api/open', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: filePath, select: selectInFolder }),
        });
        const data = await res.json();
        if (res.ok) {
          showToast(selectInFolder ? 'フォルダを開きました' : 'ドキュメントを開きました');
        } else {
          showToast(`開けませんでした: ${data.message || 'エラー'}`);
        }
      } catch (err) {
        showToast(`エラー: ${err.message}`);
      }
    }

    function updateURL(query) {
      const url = new URL(window.location);
      if (query) {
        url.searchParams.set('q', query);
      } else {
        url.searchParams.delete('q');
      }
      if (selectedIndexes.size > 0) {
        url.searchParams.set('indexes', Array.from(selectedIndexes).join(','));
      } else {
        url.searchParams.delete('indexes');
      }
      window.history.replaceState({}, '', url);
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJsStr(str) {
      if (!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // Event Listeners
    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        loadSuggestions(val);
      }, 200);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (suggestionsList.style.display === 'block') {
        const items = suggestionsList.querySelectorAll('.suggestion-item');
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
          renderSuggestions();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeSuggestionIndex = (activeSuggestionIndex - 1 + items.length) % items.length;
          renderSuggestions();
        } else if (e.key === 'Enter' && activeSuggestionIndex >= 0) {
          e.preventDefault();
          searchInput.value = suggestionsData[activeSuggestionIndex];
          hideSuggestions();
          executeSearch();
        } else if (e.key === 'Escape') {
          hideSuggestions();
        }
      } else if (e.key === 'Enter') {
        executeSearch();
      }
    });

    searchBtn.addEventListener('click', executeSearch);

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target)) {
        hideSuggestions();
      }
    });

    // Settings Modal Listeners
    settingsBtn.addEventListener('click', openSettingsModal);
    modalCloseBtn.addEventListener('click', closeSettingsModal);
    modalFooterCloseBtn.addEventListener('click', closeSettingsModal);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        closeSettingsModal();
      }
    });

    addIndexBtn.addEventListener('click', addIndex);
    newIndexPath.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addIndex();
    });
    newIndexName.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addIndex();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && settingsModal.classList.contains('open')) {
        closeSettingsModal();
      }
    });

    // Initial Load from URL
    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q');
      const idxs = params.get('indexes');
      const settingsParam = params.get('settings');

      if (idxs) {
        idxs.split(',').forEach(id => {
          const trimmed = id.trim();
          if (trimmed) selectedIndexes.add(trimmed);
        });
      }

      await loadSettingsIndexes();

      if (settingsParam === '1' || window.location.hash === '#settings') {
        openSettingsModal();
      }

      if (q) {
        searchInput.value = q;
        executeSearch();
      }
    });

    // Server-Sent Events (SSE) listener for remote window focus/settings actions
    function setupSSE() {
      if (!window.EventSource) return;
      const es = new EventSource('/api/events');
      es.onmessage = function(e) {
        try {
          const payload = JSON.parse(e.data);
          if (payload.action === 'focus') {
            closeSettingsModal();
            const q = document.getElementById('search-query') || document.getElementById('searchInput');
            if (q) {
              q.focus();
              q.select();
            }
          } else if (payload.action === 'settings') {
            openSettingsModal();
          }
        } catch(err) {}
      };
    }
    setupSSE();
  </script>
</body>
</html>
